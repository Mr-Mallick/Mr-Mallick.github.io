<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flutter developer portfolio showcasing projects, skills, and contact links.">
  <meta name="keywords" content="Flutter, Dart, Developer Portfolio, Web Portfolio, Mobile App Developer">
  <meta name="author" content="Mr Mallick">
  <meta property="og:title" content="Mr Mallick | Flutter Developer Portfolio">
  <meta property="og:description" content="Explore featured Flutter projects, technical skills, and professional profiles.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mr Mallick | Flutter Developer Portfolio">
  <meta name="twitter:description" content="Portfolio website built with Flutter Web.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mr Mallick Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Mr Mallick | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #030714;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #030714, #070e24, #0a102b);
      color: #f4f7ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.85;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite">
    <div class="spinner"></div>
    <p class="loading-text">Loading portfolio…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
